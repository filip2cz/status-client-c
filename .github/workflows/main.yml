name: Build ServerStatus clients

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test client
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run C test suite
        run: make test

  build-x86:
    name: Build x86 binaries
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install x86 toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc gcc-multilib

      - name: Compile x86 binaries
        run: |
          mkdir -p build
          gcc -std=gnu99 -O2 -Wall -Wextra -Wpedantic status.c -o build/status-linux-x64
          gcc -m32 -std=gnu99 -O2 -Wall -Wextra -Wpedantic status.c -o build/status-linux-x86

      - name: Upload x86 binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86
          path: |
            build/status-linux-x64
            build/status-linux-x86
          if-no-files-found: error

  build-arm:
    name: Build AArch64 and ARMv7 binaries
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install ARM toolchains and development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross

      - name: Compile AArch64 and ARMv7 binaries
        run: |
          mkdir -p build
          aarch64-linux-gnu-gcc -std=gnu99 -O2 -Wall -Wextra -Wpedantic status.c -o build/status-linux-aarch64
          arm-linux-gnueabihf-gcc -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -std=gnu99 -O2 -Wall -Wextra -Wpedantic status.c -o build/status-linux-armv7l

      - name: Upload AArch64 and ARMv7 binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm
          path: |
            build/status-linux-aarch64
            build/status-linux-armv7l
          if-no-files-found: error

  build-armv5:
    name: Build ARMv5 binary
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install ARMv5 toolchain and development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-linux-gnueabi libc6-dev-armel-cross

      - name: Compile ARMv5 binary
        run: |
          mkdir -p build
          arm-linux-gnueabi-gcc -march=armv5te -std=gnu99 -O2 -Wall -Wextra -Wpedantic status.c -o build/status-linux-armv5te

      - name: Upload ARMv5 binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-armv5
          path: build/status-linux-armv5te
          if-no-files-found: error

  build-riscv64:
    name: Build RISC-V 64-bit binary
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install RISC-V toolchain and development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

      - name: Compile RISC-V 64-bit binary
        run: |
          mkdir -p build
          riscv64-linux-gnu-gcc -march=rv64gc -mabi=lp64d -std=gnu99 -O2 -Wall -Wextra -Wpedantic status.c -o build/status-linux-riscv64

      - name: Upload RISC-V binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-riscv64
          path: build/status-linux-riscv64
          if-no-files-found: error

  build-blackfin:
    name: Build Blackfin binary
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download Blackfin toolchain
        run: |
          wget -q https://master.dl.sourceforge.net/project/adi-toolchain/2014R1/2014R1-RC2/x86_64/blackfin-toolchain-2014R1-RC2.x86_64.tar.bz2
          wget -q https://master.dl.sourceforge.net/project/adi-toolchain/2014R1/2014R1-RC2/x86_64/blackfin-toolchain-uclibc-default-2014R1-RC2.x86_64.tar.bz2
          tar -xf blackfin-toolchain-2014R1-RC2.x86_64.tar.bz2
          tar -xf blackfin-toolchain-uclibc-default-2014R1-RC2.x86_64.tar.bz2

      - name: Compile Blackfin binary
        run: |
          mkdir -p build
          ./opt/uClinux/bfin-linux-uclibc/bin/bfin-linux-uclibc-gcc -static -std=gnu99 -O2 -Wall -Wextra status.c -o build/status-linux-blackfin

      - name: Smoke test Blackfin binary in the toolchain simulator
        run: |
          set -euo pipefail
          ./opt/uClinux/bfin-linux-uclibc/bin/bfin-linux-uclibc-run \
            --environment user \
            --model bf532 \
            --sysroot "$GITHUB_WORKSPACE/opt/uClinux/bfin-linux-uclibc/bfin-linux-uclibc/runtime" \
            "$GITHUB_WORKSPACE/build/status-linux-blackfin" --help \
            > build/status-linux-blackfin-help.txt
          grep -q '^Usage modes:' build/status-linux-blackfin-help.txt

      - name: Upload Blackfin binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-blackfin
          path: build/status-linux-blackfin
          if-no-files-found: error

  verify-binaries:
    name: Smoke test architecture binaries
    needs:
      - build-x86
      - build-arm
      - build-armv5
      - build-riscv64
      - build-blackfin
    runs-on: ubuntu-24.04
    steps:
      - name: Download all architecture binaries
        uses: actions/download-artifact@v8
        with:
          path: build
          merge-multiple: true

      - name: Install emulators and target runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils qemu-user libc6-i386 libc6-arm64-cross libc6-armhf-cross libc6-armel-cross libc6-riscv64-cross

      - name: Run binary smoke tests
        run: |
          set -euo pipefail
          chmod +x build/status-linux-*

          check_help() {
            name="$1"
            shift
            output="/tmp/${name}-help.txt"
            "$@" --help > "$output"
            grep -q '^Usage modes:' "$output"
            echo "PASS: $name --help"
          }

          check_help status-linux-x64 ./build/status-linux-x64
          check_help status-linux-x86 ./build/status-linux-x86
          check_help status-linux-aarch64 qemu-aarch64 -L /usr/aarch64-linux-gnu ./build/status-linux-aarch64
          check_help status-linux-armv7l qemu-arm -cpu cortex-a8 -L /usr/arm-linux-gnueabihf ./build/status-linux-armv7l
          check_help status-linux-armv5te qemu-arm -cpu arm926 -L /usr/arm-linux-gnueabi ./build/status-linux-armv5te
          check_help status-linux-riscv64 qemu-riscv64 -L /usr/riscv64-linux-gnu ./build/status-linux-riscv64

          for binary in build/status-linux-*; do
            test -s "$binary"
          done
          readelf -h build/status-linux-blackfin > /tmp/status-linux-blackfin-elf.txt
          grep -q 'Class:.*ELF32' /tmp/status-linux-blackfin-elf.txt
          grep -q 'Machine:.*Blackfin' /tmp/status-linux-blackfin-elf.txt
          echo "PASS: status-linux-blackfin ELF format and architecture"

          readelf -h build/status-linux-riscv64 > /tmp/status-linux-riscv64-elf.txt
          grep -q 'Class:.*ELF64' /tmp/status-linux-riscv64-elf.txt
          grep -q 'Machine:.*RISC-V' /tmp/status-linux-riscv64-elf.txt
          echo "PASS: status-linux-riscv64 ELF format and architecture"

  release:
    name: Create draft release
    needs:
      - test
      - verify-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download all architecture binaries
        uses: actions/download-artifact@v8
        with:
          path: build
          merge-multiple: true

      - name: Set release tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "build/status*"
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          draft: true
          tag: ${{ steps.vars.outputs.sha_short }}
